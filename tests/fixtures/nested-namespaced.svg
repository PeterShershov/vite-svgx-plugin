<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- Editors re-declare the prefixes on nested <svg>/<foreignObject> roots,
       so xmlns bindings are not only a root-element concern. -->
  <svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" viewBox="0 0 12 12">
    <use xlink:href="#a" inkscape:label="nested" />
  </svg>
</svg>
