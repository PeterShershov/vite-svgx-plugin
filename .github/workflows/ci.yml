name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # The test script runs TypeScript directly via `node --test tests/*.test.ts`,
          # which relies on Node's built-in type stripping.
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm test
